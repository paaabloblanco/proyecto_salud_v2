{% extends "base.html" %}

{% block contenido %}
<form method="post" action="/plan">
  <h2>Tu semana</h2>
  <table>
    <tr><th>Día</th><th>Actividad</th><th>Hora</th></tr>
    {% for nombre in ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"] %}
    <tr>
      <td>{{ nombre }}</td>
      <td>
        <select name="actividad_{{ loop.index0 }}">
          <option value="descanso">Descanso</option>
          <option value="entreno_suave">Entreno suave</option>
          <option value="entreno_fuerte">Entreno fuerte</option>
          <option value="partido">Partido</option>
        </select>
      </td>
      <td><input type="time" name="hora_{{ loop.index0 }}"></td>
    </tr>
    {% endfor %}
  </table>
  <p class="motivo">Deja la hora vacía en los días de descanso.</p>

  <h2>Tus datos</h2>
  <p>
    <label>Peso corporal (kg):
      <input type="number" name="peso_kg" min="30" max="200" step="0.1" required>
    </label>
  </p>

  <button type="submit">Calcular objetivos</button>
</form>
{% endblock %}
